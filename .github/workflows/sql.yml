# Vérifie la SYNTAXE des fichiers SQL à chaque push et sur chaque proposition.
#
# Pourquoi : le 01/08, trois migrations sont parties avec une erreur de syntaxe,
# découverte en production par l'utilisateur qui les exécutait. pglast embarque
# le vrai analyseur de PostgreSQL (libpg_query) : ce qu'il accepte, le serveur
# l'accepte. Une relecture attentive ne remplace pas un analyseur.
#
# Deuxième filet, ajouté le 02/08 : le banc d'essai rejoue schema.sql PUIS toutes
# les migrations, dans l'ordre, sur un vrai PostgreSQL jetable (PGlite, en
# mémoire). Il attrape ce que la syntaxe ne voit pas — colonne inexistante,
# fonction manquante, migration qui dépend de quelque chose qui n'existe pas
# encore. C'est lui qui a trouvé que la vue de contrôle de santé serait refusée
# par PostgreSQL 18 (migration 43), longtemps avant que Supabase y passe.

name: Syntaxe SQL

on:
  push:
    paths: ["supabase/**.sql", "outils/**"]
  pull_request:
    paths: ["supabase/**.sql", "outils/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pglast
      - run: python outils/verif_sql.py

  banc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run banc
